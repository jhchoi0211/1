<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>제4회 성균관대학교 AI 자율주행 경진대회</title>
  <meta name="title" content="제4회 성균관대학교 AI 자율주행 경진대회">
  <meta name="description" content="제4회 성균관대학교 AI 자율주행 경진대회 은상 수상 프로젝트">
  <meta name="author" content="최제혁, 김가언, 김동민">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#2563eb">

  <meta property="og:type" content="website">
  <meta property="og:title" content="제4회 성균관대학교 AI 자율주행 경진대회">
  <meta property="og:description" content="🥈 은상 (3rd/27) · 구구카카">
  <meta property="og:url" content="https://jhchoi0211.github.io/1/">
  <meta property="og:image" content="https://jhchoi0211.github.io/1/static/images/driving%20architecture.png">

  <link rel="icon" type="image/x-icon" href="static/images/favicon.ico">
  <link rel="stylesheet" href="static/css/bulma.min.css">
  <link rel="stylesheet" href="static/css/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --page-blue: #2563eb;
      --page-ink: #172033;
      --page-muted: #667085;
      --page-surface: #f7f9fc;
      --page-border: #e6eaf0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      color: var(--page-ink);
      font-family: "Inter", "Noto Sans KR", sans-serif;
    }

    .project-hero {
      background:
        radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.12), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.10), transparent 30%),
        #ffffff;
      border-bottom: 1px solid var(--page-border);
    }

    .project-hero .hero-body {
      padding: 5rem 1.5rem 4.5rem;
    }

    .project-title {
      color: var(--page-ink);
      letter-spacing: -0.045em;
      line-height: 1.15;
    }

    .award {
      color: var(--page-blue);
      font-weight: 700;
      margin-top: 1.25rem;
    }

    .authors {
      color: var(--page-muted);
      font-weight: 500;
      margin-top: 0.75rem;
    }

    .project-section {
      padding: 4.5rem 1.5rem;
    }

    .project-section.is-soft {
      background: var(--page-surface);
    }

    .section-title {
      color: var(--page-ink);
      letter-spacing: -0.025em;
      margin-bottom: 2rem !important;
      text-align: center;
    }

    .video-card,
    .image-card {
      background: #ffffff;
      border: 1px solid var(--page-border);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(16, 24, 40, 0.07);
      overflow: hidden;
    }

    .video-card video {
      background: #000000;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }

    .image-card {
      height: 100%;
      padding: 1.25rem;
    }

    .image-card img {
      display: block;
      height: auto;
      margin: 0 auto;
      width: 100%;
    }

    .state-machine-list {
      display: grid;
      gap: 2rem;
    }

    .source-link {
      margin-top: 1.75rem;
      text-align: center;
    }

    .source-link a {
      color: var(--page-blue);
      font-weight: 600;
    }

    .footer {
      border-top: 1px solid var(--page-border);
      padding: 2rem 1.5rem;
    }

    .footer p {
      color: var(--page-muted);
      font-size: 0.875rem;
      text-align: center;
    }

    @media screen and (max-width: 768px) {
      .project-hero .hero-body {
        padding: 3.5rem 1.25rem 3rem;
      }

      .project-title {
        font-size: 2.25rem !important;
      }

      .project-section {
        padding: 3.25rem 1rem;
      }

      .image-card {
        padding: 0.75rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="hero project-hero">
      <div class="hero-body">
        <div class="container is-max-desktop has-text-centered">
          <h1 class="title is-1 project-title">
            제4회 성균관대학교 AI 자율주행 경진대회
          </h1>
          <p class="subtitle is-4 award">🥈 은상 (3rd/27)</p>
          <p class="subtitle is-5 authors">
            최제혁, 김가언, 김동민 (팀명: 구구카카)
          </p>
        </div>
      </div>
    </section>

    <section class="section project-section">
      <div class="container is-max-widescreen">
        <h2 class="title is-3 section-title">Demo Videos</h2>

        <div class="columns is-variable is-5">
          <div class="column">
            <div class="video-card">
              <video controls muted playsinline preload="metadata" aria-label="Driving demo video">
                <source src="static/videos/driving.mp4" type="video/mp4">
              </video>
            </div>
          </div>

          <div class="column">
            <div class="video-card">
              <video controls muted playsinline preload="metadata" aria-label="Mission demo video">
                <source src="static/videos/mission.mp4" type="video/mp4">
              </video>
            </div>
          </div>

          <div class="column">
            <div class="video-card">
              <video controls muted playsinline preload="metadata" aria-label="Parking demo video">
                <source src="static/videos/parking.mp4" type="video/mp4">
              </video>
            </div>
          </div>
        </div>

        <p class="source-link">
          Source:
          <a href="https://www.youtube.com/watch?v=2yOSjMr1Qcw&amp;t=14015s" target="_blank" rel="noopener noreferrer">
            YouTube
          </a>
        </p>
      </div>
    </section>

    <section class="section project-section is-soft">
      <div class="container is-max-widescreen">
        <h2 class="title is-3 section-title">System Architecture</h2>

        <div class="columns is-variable is-5">
          <div class="column">
            <figure class="image-card">
              <img
                src="static/images/driving%20architecture.png"
                alt="Autonomous driving system architecture"
                loading="lazy">
            </figure>
          </div>

          <div class="column">
            <figure class="image-card">
              <img
                src="static/images/parking%20architecture.png"
                alt="Autonomous parking system architecture"
                loading="lazy">
            </figure>
          </div>
        </div>
      </div>
    </section>

    <section class="section project-section">
      <div class="container is-max-widescreen">
        <h2 class="title is-3 section-title">State Machine</h2>

        <div class="state-machine-list">
          <figure class="image-card">
            <img
              src="static/images/driving%20state%20machine.png"
              alt="State machine for autonomous driving"
              loading="lazy">
          </figure>

          <figure class="image-card">
            <img
              src="static/images/parking%20state%20machine.png"
              alt="State machine for autonomous parking"
              loading="lazy">
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>
      Built with the
      <a href="https://github.com/eliahuhorwitz/Academic-project-page-template" target="_blank" rel="noopener noreferrer">
        Academic Project Page Template
      </a>.
    </p>
  </footer>
</body>
</html>
